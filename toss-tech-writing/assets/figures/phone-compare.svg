<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
  <!-- 디자인 글의 화면 비교. 연회색 바탕 위 휴대폰 2대, 위에 AS-IS/TO-BE 배지. 그림 안 해설 문구는 넣지 않는다(아래 cap 줄은 지우는 것이 기본).
       화면 안은 실제 UI 문구를 그대로 쓴다(재료에 있는 문구만). 그림 아래 설명은 짧게 -->
  <style>
    text { font-family: Pretendard, "Toss Product Sans", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .badge { font-size: 16px; font-weight: 700; }
    .t     { font-size: 20px; font-weight: 700; fill: #191F28; }
    .s     { font-size: 15px; fill: #6B7684; }
    .btn   { font-size: 17px; font-weight: 700; }
    .cap   { font-size: 17px; fill: #6B7684; }
  </style>
  <rect width="1000" height="720" fill="#F2F4F6"/>

  <!-- 왼쪽 -->
  <rect x="200" y="40" width="96" height="34" rx="17" fill="#4E5968"/>
  <text x="248" y="63" class="badge" text-anchor="middle" fill="#FFFFFF">AS-IS</text>
  <rect x="120" y="96" width="256" height="530" rx="36" fill="#333D4B"/>
  <rect x="132" y="108" width="232" height="506" rx="28" fill="#FFFFFF"/>
  <text x="156" y="168" class="t">화면 제목</text>
  <text x="156" y="196" class="s">화면 설명 문구</text>
  <rect x="156" y="226" width="184" height="12" rx="6" fill="#E5E8EB"/>
  <rect x="156" y="250" width="130" height="12" rx="6" fill="#E5E8EB"/>
  <rect x="152" y="540" width="192" height="54" rx="14" fill="#F2F4F6"/>
  <text x="248" y="573" class="btn" text-anchor="middle" fill="#4E5968">기존 버튼</text>
  <text x="248" y="672" class="cap" text-anchor="middle"></text>

  <!-- 오른쪽 -->
  <rect x="704" y="40" width="96" height="34" rx="17" fill="#3182F6"/>
  <text x="752" y="63" class="badge" text-anchor="middle" fill="#FFFFFF">TO-BE</text>
  <rect x="624" y="96" width="256" height="530" rx="36" fill="#333D4B"/>
  <rect x="636" y="108" width="232" height="506" rx="28" fill="#FFFFFF"/>
  <text x="660" y="168" class="t">화면 제목</text>
  <text x="660" y="196" class="s">화면 설명 문구</text>
  <rect x="660" y="226" width="184" height="12" rx="6" fill="#E5E8EB"/>
  <rect x="656" y="420" width="192" height="50" rx="14" fill="#E8F3FF"/>
  <text x="752" y="451" class="btn" text-anchor="middle" fill="#1B64DA">새 선택지</text>
  <rect x="656" y="480" width="192" height="50" rx="14" fill="#E8F3FF"/>
  <text x="752" y="511" class="btn" text-anchor="middle" fill="#1B64DA">새 선택지</text>
  <rect x="656" y="540" width="192" height="54" rx="14" fill="#F2F4F6"/>
  <text x="752" y="573" class="btn" text-anchor="middle" fill="#4E5968">기존 버튼</text>
  <text x="752" y="672" class="cap" text-anchor="middle"></text>
</svg>
